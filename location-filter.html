<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фильтр по локации — RentHome Bali</title>
<meta name="theme-color" content="#0066ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230066FF'/%3E%3Cpath d='M18 32 32 18l14 14' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--acc:#0066FF;--acc-dark:#0052CC;--acc-soft:#E6F0FF;--ink:#2D3748;--ink2:#4A5568;--mut:#718096;--line:#E2E8F0;--bg:#F7FAFC;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;padding:24px 16px}
.wrap{max-width:640px;margin:0 auto}
.top{margin-bottom:16px}
.top a{color:var(--acc);text-decoration:none;font-weight:600;font-size:14px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px}
.demo-card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:16px}
/* ===== LocationFilter component (our palette) ===== */
.lf{position:relative;display:inline-block;min-width:220px}
.lf-head{display:flex;flex-direction:column;cursor:pointer;user-select:none}
.lf-label{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.lf-value{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:14px;font-weight:500;color:var(--ink)}
.lf-value svg{width:14px;height:14px;color:#A0AEC0;transition:transform .2s}
.lf.open .lf-value svg{transform:rotate(180deg)}
.lf-drop{position:absolute;top:calc(100% + 6px);left:0;z-index:50;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:0;min-width:260px;max-width:320px;max-height:0;overflow:hidden;opacity:0;transition:max-height .25s ease,opacity .2s ease,padding .2s ease}
.lf.open .lf-drop{max-height:384px;overflow-y:auto;opacity:1;padding:16px}
.lf-group{margin:10px 0 0}
.lf-group:first-child{margin-top:0}
.lf-gtitle{font-size:11px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.lf-item{display:flex;align-items:center;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:14px;color:var(--ink2)}
.lf-item:hover{background:var(--acc-soft)}
.lf-item input{accent-color:var(--acc);width:16px;height:16px;margin:0 8px 0 0;cursor:pointer;flex:0 0 auto}
.lf-foot{display:flex;justify-content:flex-end;padding-top:6px}
.lf-clear{background:none;border:0;color:var(--acc);font-size:12.5px;font-weight:600;cursor:pointer}
/* ===== demo readout ===== */
.result{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px}
.result b{color:var(--acc-dark)}
code{background:var(--acc-soft);color:var(--acc-dark);padding:1px 6px;border-radius:4px;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/">← На главную</a></div>
  <h1>Фильтр по локации</h1>
  <p class="sub">Переиспользуемый компонент <code>createLocationFilter</code>: группы районов, мультивыбор, счётчик <code>+N</code>. Цвета — наши (#0066FF).</p>
  <div class="demo-card"><div id="lfMount"></div></div>
  <div class="result">Выбрано: <b id="lfOut">—</b><br><span id="lfCount" class="sub"></span></div>
</div>
<script>
/* ===== Reusable LocationFilter (vanilla, no deps) ===== */
const DIST_GROUPS=[
 {g:"ПЛЯЖНАЯ ЗОНА И ЦЕНТР",items:[["Seminyak","Семиньяк"],["Oberoi","Оберой"],["Legian","Легиан"],["Kuta","Кута"]]},
 {g:"ЖИЛАЯ ЗОНА",items:[["Canggu","Чангу"],["Pererenan","Переренан"],["Umalas","Умалас"]]},
 {g:"ЮГ",items:[["Uluwatu","Улувату"],["Jimbaran","Джимбаран"],["Nusa Dua","Нуса-Дуа"]]},
 {g:"ЦЕНТР И ВОСТОК",items:[["Ubud","Убуд"],["Denpasar","Денпасар"],["Sanur","Санур"],["Tabanan","Табанан"]]}];
function createLocationFilter(mount,{groups=DIST_GROUPS,selected=new Set(),lang="ru",anyLabel="Любая локация",onChange}={}){
  const name=en=>{for(const gr of groups)for(const [e,r] of gr.items)if(e===en)return lang==="ru"?r:e;return en;};
  mount.innerHTML=`<div class="lf" id="lfBox">
    <div class="lf-head" id="lfHead" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
      <span class="lf-label">Локация</span>
      <span class="lf-value"><span id="lfVal"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg></span>
    </div>
    <div class="lf-drop" id="lfDrop" role="listbox"></div></div>`;
  const box=mount.querySelector("#lfBox"),val=mount.querySelector("#lfVal"),drop=mount.querySelector("#lfDrop");
  function paintLabel(){const s=[...selected];val.textContent=s.length===0?anyLabel:s.length===1?name(s[0]):`${name(s[0])} +${s.length-1}`;}
  function paintDrop(){
    drop.innerHTML=groups.map(gr=>`<div class="lf-group"><div class="lf-gtitle">${gr.g}</div>${gr.items.map(([en,ru])=>`<label class="lf-item"><input type="checkbox" data-d="${en}"${selected.has(en)?" checked":""}> ${lang==="ru"?ru:en}</label>`).join("")}</div>`).join("")+`<div class="lf-foot"><button class="lf-clear" id="lfClr">Очистить</button></div>`;
    drop.querySelectorAll("[data-d]").forEach(cb=>cb.onchange=()=>{cb.checked?selected.add(cb.dataset.d):selected.delete(cb.dataset.d);paintLabel();onChange&&onChange(new Set(selected));});
    drop.querySelector("#lfClr").onclick=e=>{e.stopPropagation();selected.clear();paintDrop();paintLabel();onChange&&onChange(new Set(selected));};
  }
  function toggle(force){const open=force!==undefined?force:!box.classList.contains("open");box.classList.toggle("open",open);mount.querySelector("#lfHead").setAttribute("aria-expanded",open);}
  mount.querySelector("#lfHead").onclick=e=>{e.stopPropagation();toggle();};
  document.addEventListener("click",e=>{if(!e.target.closest("#lfBox"))toggle(false);});
  paintDrop();paintLabel();
  return{get selected(){return new Set(selected);},clear(){selected.clear();paintDrop();paintLabel();}};
}
/* ===== demo wiring: live count from data/listings.json ===== */
let DATA=[];
fetch("data/listings.json").then(r=>r.json()).then(j=>{DATA=j;update();}).catch(()=>{});
const lf=createLocationFilter(document.getElementById("lfMount"),{onChange:update});
function update(sel){
  const s=sel||lf.selected,arr=[...s];
  document.getElementById("lfOut").textContent=arr.length?arr.join(", "):"—";
  if(!DATA.length){document.getElementById("lfCount").textContent="";return;}
  const hit=DATA.filter(x=>!s.size||s.has(x.locationEn)).length;
  document.getElementById("lfCount").textContent=`Совпадений в каталоге: ${hit} из ${DATA.length}`;
}
update();
</script>
</body>
</html>
